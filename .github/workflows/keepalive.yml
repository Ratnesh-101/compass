# Keepalive workflow for production backend
#
# Why this exists:
# The production backend runs on a free hosting tier that goes to sleep
# after ~15 minutes without traffic, causing visitors to experience a ~30-second
# cold start delay. This scheduled workflow pings the public health endpoint
# every 10 minutes to keep the backend warm and responsive.
#
# GitHub Actions schedule notes:
# GitHub may delay scheduled runs during peak hours. In addition, GitHub automatically
# pauses scheduled workflows after 60 days of repository inactivity (no commits).
#
# Domain maintenance:
# The URL (https://compass-farmlytics.vercel.app/health) must be updated if the
# production domain changes.

name: "Keep backend warm"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency: { group: keepalive, cancel-in-progress: true }

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl --silent --show-error --location --max-time 60 --retry 2 --retry-delay 5 --output /dev/null --write-out "health status: %{http_code}\n" https://compass-farmlytics.vercel.app/health || true)
          echo "$response"
          code=$(echo "$response" | awk '{print $NF}' | tr -d '\r')
          code="${code:-000}"
          echo "Status code: $code"
          if [ "$code" = "200" ]; then
            exit 0
          else
            echo "::warning::health check returned $code"
            exit 0
          fi
