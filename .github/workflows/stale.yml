name: "Mark Inactive Issues & PRs"

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has had no activity for 45 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions!'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has had no activity for 30 days. It will be closed in 7 days if no further activity occurs.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security,work-in-progress'
          days-before-stale: 45
          days-before-pr-stale: 30
          days-before-close: 7
