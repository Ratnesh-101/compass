name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Integration Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
          pip install -e ./cli

      - name: Syntax and Compile Checks
        run: |
          python -m py_compile backend/main.py backend/router.py backend/orchestrator.py cli/assistant_cli.py backend/jobs/consolidate.py

      - name: Initialize Database Schema
        run: |
          PGPASSWORD=compass psql -h localhost -U compass -d compass -f backend/memory/schema.sql

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://compass:compass@localhost:5432/compass
          AUTH_TOKEN: dev-token
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY || 'mock-key' }}
        run: |
          pytest tests/ -v
