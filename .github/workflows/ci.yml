name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: lint + tests
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Lint, Test & Integration Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Install CLI (editable)
        run: |
          pip install -e ./cli

      - name: Install Ruff (linter)
        run: pip install ruff

      - name: Syntax check — compile key modules
        run: |
          python -m py_compile \
            backend/main.py \
            backend/router.py \
            backend/orchestrator.py \
            backend/agent.py \
            backend/jobs/consolidate.py \
            cli/assistant_cli.py

      - name: Ruff — lint backend, cli, tests
        run: ruff check backend cli tests

      - name: Source Code File Size Audit (<=500 PASS, 501-700 WARN, >700 FAIL)
        run: python scripts/check_file_sizes.py

      - name: Route Table & Test Coverage Verification
        run: python scripts/verify_route_table.py

      - name: Bandit — Security AST Analysis
        run: |
          pip install bandit
          bandit -r backend/ -ll

      - name: Initialize test database schema
        env:
          PGPASSWORD: compass
        run: |
          psql -h localhost -U compass -d compass_test -f backend/memory/schema.sql

      - name: Collect tests (verify count before running)
        env:
          DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_primary_standby
          TEST_DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_test
          AUTH_TOKEN: ci-test-token
          NEBIUS_API_KEY: mock-key-not-used-in-tests
          TAVILY_API_KEY: mock-key-not-used-in-tests
          PROD_DB_ENDPOINT: ""
        run: |
          python -m pytest tests --collect-only -q 2>&1 | tail -5

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_primary_standby
          TEST_DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_test
          AUTH_TOKEN: ci-test-token
          NEBIUS_API_KEY: mock-key-not-used-in-tests
          TAVILY_API_KEY: mock-key-not-used-in-tests
          PROD_DB_ENDPOINT: ""
        run: |
          python -m pytest tests -v -ra --tb=short --no-header \
            -p no:warnings \
            2>&1

  # ─────────────────────────────────────────────────────────────
  # Frontend: install + build
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Docker: config validation + image builds only.
  # No containers started. No registry login. No push. No deploy.
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker — Config & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build all Compose services
        run: docker compose build
