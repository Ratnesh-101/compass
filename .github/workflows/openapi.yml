name: OpenAPI Schema Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/openapi.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/openapi.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-openapi:
    name: Validate & Export API Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate OpenAPI JSON Specification
        run: |
          python -c "import json; from backend.main import app; schema = app.openapi(); json.dump(schema, open('openapi.json', 'w'), indent=2); print('Successfully exported OpenAPI specification with', len(schema['paths']), 'endpoints')"

      - name: Upload OpenAPI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: compass-openapi-spec
          path: openapi.json
          retention-days: 14
